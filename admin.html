<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления | Admin</title>
    <style>
        :root {
            --bg-main: #070709;
            --card-bg: #111116;
            --accent-green: #00f2fe;
            --text-primary: #ffffff;
            --text-secondary: #8a8a9e;
            --border-color: #242433;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .panel-box {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 32px 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
        }

        h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-green);
            text-align: center;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #070709;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00f2fe 0%, #7000ff 100%);
            color: #000000;
            font-weight: 900;
            font-size: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
            transition: transform 0.1s;
        }

        .save-btn:active {
            transform: scale(0.97);
        }

        .success-msg {
            text-align: center;
            color: var(--accent-green);
            font-size: 13px;
            font-weight: 600;
            margin-top: 15px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="panel-box">
        <h2>⚙️ Панель управления</h2>

        <div class="form-group">
            <label>Всего подписчиков в TikTok:</label>
            <input type="number" id="admSubs" placeholder="0">
        </div>

        <div class="form-group">
            <label>Сделано отжиманий:</label>
            <input type="number" id="admDone" placeholder="0">
        </div>

        <button class="save-btn" onclick="saveData()">Сохранить изменения 🚀</button>
        <div class="success-msg" id="successMsg">✅ Данные успешно обновлены!</div>
    </div>

    <script>
        window.onload = function() {
            document.getElementById('admSubs').value = localStorage.getItem('saved_subs') || 0;
            document.getElementById('admDone').value = localStorage.getItem('saved_done') || 0;
        };

        function saveData() {
            let subs = document.getElementById('admSubs').value;
            let done = document.getElementById('admDone').value;

            localStorage.setItem('saved_subs', subs);
            localStorage.setItem('saved_done', done);

            let msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 2500);
        }
    </script>
</body>
</html>
