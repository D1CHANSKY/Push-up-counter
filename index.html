<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>: Отжимания за подписку :</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        h1 {
            font-size: 22px;
            color: #ff4757;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        .card {
            background: #252525;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .label {
            font-size: 14px;
            color: #b2bec3;
            margin-bottom: 5px;
        }
        .counter-box {
            font-size: 42px;
            font-weight: bold;
            color: #2ed573;
        }
        .counter-box.debt {
            color: #ff4757;
        }
        .btn {
            display: block;
            width: 100%;
            background: #ff4757;
            color: white;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 25px;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ TikTok ⚡</h1>
        <div class="subtitle">1 подписчик = 1 отжимание</div>
        
        <div class="card">
            <div class="label">Осталось отжаться долг:</div>
            <div class="counter-box debt" id="left">150</div> <!-- МЕНЯЙ ЭТУ ЦИФРУ -->
        </div>

        <div class="card">
            <div class="label">Уже сделано:</div>
            <div class="counter-box" id="done">300</div> <!-- И ЭТУ ЦИФРУ ЕСЛИ ХОЧЕШЬ -->
        </div>

        <a href="https://www.tiktok.com/@dont.stop.push.up" class="link-btn btn" target="_blank">Перейти в TikTok 🔥</a>
    </div>
</body>
</html>
