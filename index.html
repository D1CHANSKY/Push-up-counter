<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отжимания за подписку | Live Challenge</title>
    <style>
        :root {
            --bg-main: #070709;
            --card-bg: #111116;
            --card-inner: #1a1a24;
            --accent-red: #ff2a5f;
            --accent-green: #00f2fe;
            --accent-purple: #7000ff;
            --text-primary: #ffffff;
            --text-secondary: #8a8a9e;
            --border-color: #242433;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 95, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.05) 0%, transparent 40%);
        }

        .wrapper {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 32px;
            padding: 32px 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9),
                        0 0 40px rgba(255, 42, 95, 0.08);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(255, 42, 95, 0.1);
            border: 1px solid rgba(255, 42, 95, 0.3);
            border-radius: 20px;
            color: var(--accent-red);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-inner);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card.full-width {
            grid-column: span 2;
            background: linear-gradient(145deg, rgba(255, 42, 95, 0.08), rgba(112, 0, 255, 0.08));
            border: 1px solid rgba(255, 42, 95, 0.2);
        }

        .stat-title {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 900;
            line-height: 1;
        }

        .stat-value.red {
            color: var(--accent-red);
            text-shadow: 0 0 20px rgba(255, 42, 95, 0.3);
        }

        .stat-value.green {
            color: var(--accent-green);
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .progress-section {
            background: var(--card-inner);
            padding: 18px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #070709;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-green));
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.1, 1, 0.1, 1);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .status-banner {
            font-size: 13px;
            text-align: center;
            padding: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .tiktok-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff2a5f 0%, #7000ff 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(255, 42, 95, 0.35);
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .tiktok-btn:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: #3a3a4d;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <div class="live-badge"><span class="live-dot"></span> Live Challenge</div>
            <h1>Отжимания за подписку</h1>
            <div class="subtitle">1 подписчик = 1 отжимание в копилку</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card full-width">
                <div class="stat-title">Осталось отжаться (Долг)</div>
                <div class="stat-value red" id="debtDisplay">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Подписчики</div>
                <div class="stat-value" id="subsDisplay">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Сделано</div>
                <div class="stat-value green" id="doneDisplay">0</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span>Прогресс выполнения</span>
                <span id="percentDisplay">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="status-banner" id="statusBanner">
            Загрузка данных...
        </div>

        <a href="https://www.tiktok.com/@dont.stop.push.up?_r=1&_t=ZS-98bNEKy032v" class="tiktok-btn" target="_blank">
            <span>Перейти в TikTok</span> 🔥
        </a>

        <div class="footer">
            D1CHANSKY SYSTEM &bull; 2026
        </div>
    </div>

    <script>
        function updateView() {
            let subs = Number(localStorage.getItem('saved_subs')) || 0;
            let done = Number(localStorage.getItem('saved_done')) || 0;
            let debt = Math.max(0, subs - done);

            document.getElementById('subsDisplay').innerText = subs;
            document.getElementById('doneDisplay').innerText = done;
            document.getElementById('debtDisplay').innerText = debt;

            let percent = 0;
            if (subs > 0) {
                percent = Math.min(100, Math.round((done / subs) * 100));
            } else if (done > 0) {
                percent = 100;
            }

            document.getElementById('percentDisplay').innerText = percent + "%";
            document.getElementById('progressBar').style.width = percent + "%";

            let statusElement = document.getElementById('statusBanner');
            if (debt === 0 && subs > 0) {
                statusElement.innerText = "🎉 Все отжимания выполнены! Вы красавчик!";
                statusElement.style.color = "#00f2fe";
            } else if (debt > 0) {
                statusElement.innerText = `💪 Нужно сделать еще ${debt} отжиманий!`;
                statusElement.style.color = "#ff2a5f";
            } else {
                statusElement.innerText = "🚀 Челлендж активен! Ждем подписчиков!";
                statusElement.style.color = "#8a8a9e";
            }
        }

        window.onload = updateView;
        window.addEventListener('storage', updateView);
    </script>
</body>
</html>
