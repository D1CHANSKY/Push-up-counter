<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отжимания за подписку</title>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --card-bg: #141419;
            --card-inner: #1e1e26;
            --accent-red: #ff2a5f;
            --accent-green: #00f2fe;
            --text-primary: #ffffff;
            --text-secondary: #9a9aab;
            --border-color: #2a2a36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .wrapper {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 28px 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 95, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(45deg, #ff2a5f, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-inner);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-card.full-width {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(255, 42, 95, 0.1), rgba(112, 0, 255, 0.1));
            border: 1px solid rgba(255, 42, 95, 0.3);
        }

        .stat-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
        }

        .stat-value.red { color: var(--accent-red); text-shadow: 0 0 12px rgba(255, 42, 95, 0.4); }
        .stat-value.green { color: var(--accent-green); text-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }

        .progress-section {
            background: var(--card-inner);
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #0f0f14;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-green));
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .status-banner {
            font-size: 13px;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .tiktok-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #ff2a5f, #7000ff);
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(255, 42, 95, 0.3);
            margin-bottom: 15px;
        }

        /* Удобная панель управления прямо на сайте */
        .control-panel {
            background: var(--card-inner);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-top: 15px;
        }

        .control-panel h3 {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 10px;
            text-align: left;
        }

        .input-group label {
            font-size: 11px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 3px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: #0a0a0c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-green);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #444455;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <h1>Отжимания за подписку</h1>
            <div class="subtitle">1 подписчик = 1 отжимание</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card full-width">
                <div class="stat-title">ОСТАЛОСЬ ОТЖАТЬСЯ (ДОЛГ)</div>
                <div class="stat-value red" id="debtDisplay">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Подписчики</div>
                <div class="stat-value" id="subsDisplay">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Сделано</div>
                <div class="stat-value green" id="doneDisplay">0</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span>Прогресс</span>
                <span id="percentDisplay">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="status-banner" id="statusBanner">
            Загрузка...
        </div>

        <a href="https://www.tiktok.com/@dont.stop.push.up?_r=1&_t=ZS-98bNEKy032v" class="tiktok-btn" target="_blank">
            <span>Перейти в TikTok</span> 🔥
        </a>

        <!-- УДОБНАЯ ПАНЕЛЬ ДЛЯ ИЗМЕНЕНИЯ ЦИФР -->
        <div class="control-panel">
            <h3>⚙️ Управление цифрами</h3>
            
            <div class="input-group">
                <label>Сколько всего подписчиков:</label>
                <input type="number" id="inputSubs" value="0" oninput="calculate()">
            </div>

            <div class="input-group">
                <label>Сколько отжиманий уже сделал:</label>
                <input type="number" id="inputDone" value="0" oninput="calculate()">
            </div>
        </div>

        <div class="footer">
            Tracker
        </div>
    </div>

    <script>
        // Функция автоматического подсчета и обновления экрана
        function calculate() {
            let subs = Number(document.getElementById('inputSubs').value) || 0;
            let done = Number(document.getElementById('inputDone').value) || 0;
            let debt = Math.max(0, subs - done);

            // Вывод чисел
            document.getElementById('subsDisplay').innerText = subs;
            document.getElementById('doneDisplay').innerText = done;
            document.getElementById('debtDisplay').innerText = debt;

            // Расчет прогресса в процентах
            let percent = 0;
            if (subs > 0) {
                percent = Math.min(100, Math.round((done / subs) * 100));
            } else if (done > 0) {
                percent = 100;
            }

            document.getElementById('percentDisplay').innerText = percent + "%";
            document.getElementById('progressBar').style.width = percent + "%";

            // Текст статуса
            let statusElement = document.getElementById('statusBanner');
            if (debt === 0 && subs > 0) {
                statusElement.innerText = "🎉 Все отжимания сделаны! Красавчик!";
                statusElement.style.color = "#00f2fe";
            } else if (debt > 0) {
                statusElement.innerText = `💪 Осталось сделать еще ${debt} отжиманий!`;
                statusElement.style.color = "#ff2a5f";
            } else {
                statusElement.innerText = "🚀 Введи текущие данные в панели ниже!";
                statusElement.style.color = "#9a9aab";
            }

            // Сохраняем в память телефона, чтобы цифры не сбрасывались при обновлении страницы
            localStorage.setItem('saved_subs', subs);
            localStorage.setItem('saved_done', done);
        }

        // Автозагрузка сохраненных цифр при открытии сайта
        window.onload = function() {
            let savedSubs = localStorage.getItem('saved_subs');
            let savedDone = localStorage.getItem('saved_done');

            if (savedSubs !== null) document.getElementById('inputSubs').value = savedSubs;
            if (savedDone !== null) document.getElementById('inputDone').value = savedDone;

            calculate();
        };
    </script>
</body>
</html>
